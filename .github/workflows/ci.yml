name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the run for the previous push. Runs on main always finish,
# so every merged commit is checked even when two merges land a few seconds apart.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The checks themselves are in bun-app.yml, shared with AI Diving Monitor.
jobs:
  app:
    name: App
    uses: ./.github/workflows/bun-app.yml
    with:
      mobile: true
