name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the run for the previous push. Runs on main always finish,
# so every merged commit is checked even when two merges land a few seconds apart.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to a commit (the version tag can be moved); Dependabot keeps them up to date.
jobs:
  check:
    name: Typecheck, lint, tests with coverage, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test:coverage
      - name: Coverage summary
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        run: |
          bun -e '
            const { total } = JSON.parse(await Bun.file("coverage/coverage-summary.json").text());
            const row = (k) => `| ${k} | ${total[k].pct}% | ${total[k].covered}/${total[k].total} |`;
            console.log(["### Test coverage", "| | % | covered |", "|---|---|---|",
              ...["statements", "branches", "functions", "lines"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      # The phone app is only type-checked above; this builds it the way the APK gets it (no keys in CI).
      - run: bun run build:mobile

  windows:
    name: Tests on Windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run test

  e2e:
    name: End-to-end tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Chrome and Edge are the real browsers; the phone app (Android WebView) is tested in Chrome.
          - browser: chrome
            install: --force chrome
            projects: --project=desktop-chrome --project=phone
          - browser: edge
            install: --force msedge
            projects: --project=desktop-edge
          - browser: firefox
            install: firefox
            projects: --project=desktop-firefox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # --force: the runner image may already have Chrome or Edge; Playwright then reinstalls the stable build.
      - run: bunx playwright install --with-deps ${{ matrix.install }}
        timeout-minutes: 5
      # Builds and starts both apps (playwright.config.ts), then drives them – offline, no keys.
      - run: bun run test:e2e ${{ matrix.projects }}
      - name: Upload the report (screenshots and traces of failed tests)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
